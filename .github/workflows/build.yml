name: Build & Publish

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Match update-bun.yml and .pre-commit-config.yaml.
          version: "0.13.5"
          enable-cache: false

      - name: Install locked development dependencies
        run: uv sync --locked --only-dev

      - name: Run unit tests (no binary, no network)
        run: PYTHONPATH=src uv run --no-sync python -m pytest tests/test_runtime.py tests/test_build_hook.py tests/test_update_bun.py -q

  build:
    name: Build wheels (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # linux-64
          - os: ubuntu-latest
            python: 313
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 313
            platform_id: musllinux_x86_64
          # linux-aarch64
          - os: ubuntu-24.04-arm
            python: 313
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 313
            platform_id: musllinux_aarch64
          # macos-x86_64
          - os: macos-15-intel
            python: 313
            platform_id: macosx_x86_64
          # macos-arm64
          - os: macos-15
            python: 313
            platform_id: macosx_arm64
          # windows-amd64
          - os: windows-latest
            python: 313
            platform_id: win_amd64
          # windows-arm64
          - os: windows-11-arm
            python: 313
            platform_id: win_arm64

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "cp {wheel} {dest_dir}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "cp {wheel} {dest_dir}"
          CIBW_BEFORE_TEST: "pip install pytest"
          CIBW_TEST_COMMAND: "bun --version && python -m bun_wheel --version && pytest {project}/tests/test_smoke.py -q"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform_id }}
          path: wheelhouse/*.whl

  runtime-compatibility:
    name: Wheel compatibility (Python 3.10)
    needs: [build]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Match update-bun.yml and .pre-commit-config.yaml.
          version: "0.13.5"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels-manylinux_x86_64
          path: wheelhouse/

      - name: Install locked runtime test dependencies
        run: uv sync --locked --only-group test

      - name: Install built wheel
        run: uv pip install --python .venv/bin/python --no-deps wheelhouse/*.whl

      - name: Test installed wheel and CLI
        # Import the installed wheel, not the source tree; --no-sync preserves it.
        run: |
          uv run --no-sync --only-group test bun --version
          uv run --no-sync --only-group test python -m bun_wheel --version
          uv run --no-sync --only-group test python -m pytest tests/test_runtime.py tests/test_smoke.py -q

  publish:
    name: Publish to PyPI
    needs: [test, build, runtime-compatibility]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
