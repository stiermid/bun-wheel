name: Check for Bun updates

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-update-pr
  cancel-in-progress: false

jobs:
  update:
    name: Open Bun update PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Match .pre-commit-config.yaml and avoid lock format migrations.
          version: "0.11.19"
          enable-cache: false

      - name: Check latest stable Bun release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_bun.py

      - name: Open or update pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          base: master
          branch: automation/update-bun
          add-paths: |
            pyproject.toml
            uv.lock
            LICENSES/Bun-LICENSE.md
            LICENSES/bun.json
          commit-message: "chore: bump Bun to v${{ steps.check.outputs.version }}"
          title: "chore: bump Bun to v${{ steps.check.outputs.version }}"
          body: |
            ## Bun update

            Updates `bun-wheel` to Bun **${{ steps.check.outputs.version }}**.

            Upstream release: ${{ steps.check.outputs.release_url }}
            Licensing source: https://github.com/oven-sh/bun/tree/${{ steps.check.outputs.source_commit }}

            - All eight supported platform archives are available upstream.
            - The upstream checksum manifest has an entry for each archive.
            - `uv.lock` has been refreshed without requesting dependency upgrades.
            - The upstream licensing snapshot and manifest have been refreshed from
              the resolved release commit, including WebKit/TinyCC source revisions.
            - Stable explanatory notices and retained MIT/LGPL texts are unchanged.
            - Wheel builds verify downloaded archives against upstream checksums.

            This is a factual refresh, **not a redistribution compliance approval**.

            ### Maintainer steps

            1. If prompted, click **Approve workflows to run** to start PR checks.
            2. Review the generated licensing diff and follow the redistribution
               checklist in `CONTRIBUTING.md`. Collect any new required notices and
               resolve applicable LGPL source/relinking requirements before publishing.
            3. Review the upstream release and wait for unit tests and all wheel builds.
            4. Merge only after the licensing review, then push the matching version tag to publish.

            This automation does not approve or merge PRs, create tags, or publish releases.
