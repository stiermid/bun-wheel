name: Check for Bun updates

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-update-pr
  cancel-in-progress: false

jobs:
  update:
    name: Open Bun update PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Match .pre-commit-config.yaml and avoid lock format migrations.
          version: "0.13.5"
          enable-cache: false

      - name: Check latest stable Bun release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_bun.py

      - name: Open or update pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: master
          branch: automation/update-bun
          add-paths: |
            pyproject.toml
            uv.lock
          commit-message: "chore: bump Bun to v${{ steps.check.outputs.version }}"
          title: "chore: bump Bun to v${{ steps.check.outputs.version }}"
          body: |
            ## Bun update

            Updates `bun-wheel` to Bun **${{ steps.check.outputs.version }}**.

            Upstream release: ${{ steps.check.outputs.release_url }}

            - All eight supported platform archives are available upstream.
            - The upstream checksum manifest has an entry for each archive.
            - `uv.lock` has been refreshed without requesting dependency upgrades.
            - Wheel builds verify downloaded archives against upstream checksums.

            ### Maintainer steps

            1. If prompted, click **Approve workflows to run** to start PR checks.
            2. Review the upstream release and wait for unit tests and all wheel builds.
            3. Merge when satisfied, then push the matching version tag to publish.

            This automation does not approve or merge PRs, create tags, or publish releases.
